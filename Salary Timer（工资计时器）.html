<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时工资豪华计时器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
        }

        /* 动态流光背景 */
        body {
            background: linear-gradient(135deg, #0f0a00 0%, #2b1d00 50%, #0f0a00 100%);
            background-size: 400% 400%;
            animation: bgFlow 8s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
            color: #ffd700;
            position: relative;
        }

        @keyframes bgFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 金色光效点缀 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255,215,0,0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 650px;
            margin: 40px auto;
            padding: 40px 30px;
            text-align: center;
            background: rgba(255, 215, 0, 0.06);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.4), inset 0 0 30px rgba(255, 215, 0, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        /* 主容器隐藏样式 */
        .container-hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
            height: 0;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 35px;
            background: linear-gradient(45deg, #ffd700, #fff3b0, #ffd700);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            letter-spacing: 3px;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 18px 0;
            flex-wrap: wrap;
        }

        .input-group label {
            font-size: 18px;
            width: 140px;
            text-align: right;
            margin-right: 15px;
            font-weight: 500;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        .input-group input {
            width: 200px;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.6);
            color: #ffd700;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .gold-btn {
            padding: 12px 24px;
            font-size: 16px;
            background: linear-gradient(45deg, #b8860b, #ffd700, #b8860b);
            color: #000;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            transition: all 0.3s;
        }

        .gold-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.7);
        }

        .gold-btn:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }

        .secondary-btn {
            background: linear-gradient(45deg, #2b1f00, #4a3500);
            color: #ffd700;
            border: 1px solid #ffd700;
        }

        .money-display {
            margin-top: 40px;
            padding: 30px 20px;
            border: 1px solid rgba(255, 215, 0, 0.6);
            border-radius: 20px;
            background: rgba(255, 215, 0, 0.04);
            box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.08);
        }

        .money-title {
            font-size: 20px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .real-money {
            font-size: 56px;
            font-weight: bold;
            margin: 15px 0;
            background: linear-gradient(45deg, #ffd700, #fff3b0, #ffae00);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            line-height: 1.2;
        }

        .money-sub {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
        }

        .money-item {
            text-align: center;
        }

        .money-item-label {
            font-size: 16px;
            opacity: 0.8;
        }

        .money-item-value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .status-tip {
            margin-top: 15px;
            font-size: 15px;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        .status-working {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
        }

        .status-pause {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff0000;
        }

        /* 3D立体金币样式 */
        .coin {
            position: fixed;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff7ae, #ffd700 40%, #b8860b 100%);
            box-shadow: 0 0 12px #ffd700, inset -2px -2px 5px rgba(0,0,0,0.3), inset 2px 2px 5px rgba(255,255,255,0.5);
            pointer-events: none;
            z-index: 999;
            will-change: transform, opacity;
            display: none;
        }

        /* 历史记录弹窗 */
        .history-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .history-content {
            background: #1a1200;
            border: 2px solid #ffd700;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 70vh;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255,215,0,0.4);
            overflow-y: auto;
        }

        .history-title {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
            color: #ffd700;
            font-weight: bold;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,215,0,0.2);
            font-size: 16px;
        }

        .history-date {
            color: #fff3b0;
        }

        .history-money {
            color: #ffd700;
            font-weight: bold;
        }

        .history-empty {
            text-align: center;
            color: rgba(255,215,0,0.5);
            padding: 20px 0;
        }

        .close-btn {
            width: 100%;
            margin-top: 20px;
            padding: 10px 0;
        }

        /* 数字跳动动画 */
        @keyframes numJump {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .num-animate {
            animation: numJump 0.3s ease;
        }

        /* ====================== 新增：迷你悬浮窗样式 ====================== */
        .mini-window {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 220px;
            background: rgba(15, 10, 0, 0.95);
            border: 2px solid #ffd700;
            border-radius: 16px;
            padding: 15px;
            z-index: 9999;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            backdrop-filter: blur(10px);
            display: none;
            cursor: move;
            user-select: none;
        }

        .mini-window-show {
            display: block;
        }

        .mini-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .mini-title {
            font-size: 14px;
            font-weight: bold;
            color: #ffd700;
        }

        .mini-control {
            display: flex;
            gap: 8px;
        }

        .mini-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: #ffd700;
            color: #000;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .mini-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 8px #ffd700;
        }

        .mini-money {
            text-align: center;
            margin: 8px 0;
        }

        .mini-total {
            font-size: 22px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
            line-height: 1.2;
        }

        .mini-today {
            font-size: 14px;
            color: #fff3b0;
            margin-top: 4px;
        }

        .mini-status {
            text-align: center;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            margin-top: 8px;
            display: inline-block;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- 主界面容器 -->
    <div class="container" id="mainContainer">
        <h1>💰 实时工资豪华计时器 💰</h1>

        <div class="input-group">
            <label>月薪(元)：</label>
            <input type="number" id="monthSalary" placeholder="请输入你的月薪">
        </div>
        <div class="input-group">
            <label>月上班天数：</label>
            <input type="number" id="workDays" placeholder="每月工作日天数">
        </div>
        <div class="input-group">
            <label>上班时间：</label>
            <input type="time" id="startTime">
        </div>
        <div class="input-group">
            <label>下班时间：</label>
            <input type="time" id="endTime">
        </div>

        <div class="btn-group">
            <button class="gold-btn" id="startBtn">开启实时算薪</button>
            <button class="gold-btn secondary-btn" id="pauseBtn" disabled>暂停/继续</button>
            <button class="gold-btn secondary-btn" id="miniBtn" disabled>迷你模式</button>
            <button class="gold-btn secondary-btn" id="resetBtn">重置</button>
            <button class="gold-btn secondary-btn" id="historyBtn">历史记录</button>
        </div>

        <div class="money-display">
            <div class="money-title">累计已赚金额</div>
            <div class="real-money" id="realMoney">0.00 元</div>
            <div class="money-sub">
                <div class="money-item">
                    <div class="money-item-label">今日累计</div>
                    <div class="money-item-value" id="todayMoney">0.00 元</div>
                </div>
                <div class="money-item">
                    <div class="money-item-label">每秒收入</div>
                    <div class="money-item-value" id="perSecondMoney">0.0000 元</div>
                </div>
            </div>
            <div class="status-tip status-pause" id="statusTip">未开始计时</div>
        </div>
    </div>

    <!-- 新增：迷你悬浮窗 -->
    <div class="mini-window" id="miniWindow">
        <div class="mini-header">
            <div class="mini-title">实时赚薪中</div>
            <div class="mini-control">
                <button class="mini-btn" id="miniPauseBtn">⏸</button>
                <button class="mini-btn" id="maxBtn">□</button>
            </div>
        </div>
        <div class="mini-money">
            <div class="mini-total" id="miniTotalMoney">0.00元</div>
            <div class="mini-today">今日：<span id="miniTodayMoney">0.00元</span></div>
        </div>
        <div class="mini-status status-pause" id="miniStatus">未开始</div>
    </div>

    <!-- 历史记录弹窗 -->
    <div class="history-modal" id="historyModal">
        <div class="history-content">
            <div class="history-title">📊 每日工资历史记录</div>
            <div id="historyList">
                <div class="history-empty">暂无历史记录</div>
            </div>
            <button class="gold-btn close-btn" id="closeHistoryBtn">关闭</button>
        </div>
    </div>

    <!-- 金币音效 -->
    <audio id="coinSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-coins-handling-1939.mp3" type="audio/mpeg">
    

    <script>
        // ====================== 核心变量 ======================
        const mainContainer = document.getElementById('mainContainer');
        const miniWindow = document.getElementById('miniWindow');
        const monthSalaryEl = document.getElementById('monthSalary');
        const workDaysEl = document.getElementById('workDays');
        const startTimeEl = document.getElementById('startTime');
        const endTimeEl = document.getElementById('endTime');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const miniBtn = document.getElementById('miniBtn');
        const resetBtn = document.getElementById('resetBtn');
        const historyBtn = document.getElementById('historyBtn');
        const realMoneyEl = document.getElementById('realMoney');
        const todayMoneyEl = document.getElementById('todayMoney');
        const perSecondMoneyEl = document.getElementById('perSecondMoney');
        const statusTipEl = document.getElementById('statusTip');
        const historyModal = document.getElementById('historyModal');
        const historyList = document.getElementById('historyList');
        const closeHistoryBtn = document.getElementById('closeHistoryBtn');
        const coinSound = document.getElementById('coinSound');
        // 迷你窗元素
        const miniTotalMoneyEl = document.getElementById('miniTotalMoney');
        const miniTodayMoneyEl = document.getElementById('miniTodayMoney');
        const miniStatusEl = document.getElementById('miniStatus');
        const miniPauseBtn = document.getElementById('miniPauseBtn');
        const maxBtn = document.getElementById('maxBtn');

        let perSecondMoney = 0;
        let totalMoney = 0;
        let todayMoney = 0;
        let lastTenNum = 0;
        let timer = null;
        let isPaused = false;
        let todayDate = getTodayDate();
        const COIN_POOL_SIZE = 50;
        const coinPool = [];
        let poolIndex = 0;
        // 拖拽相关变量
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        // ====================== 初始化 ======================
        // 初始化金币对象池
        function initCoinPool() {
            for (let i = 0; i < COIN_POOL_SIZE; i++) {
                const coin = document.createElement('div');
                coin.className = 'coin';
                document.body.appendChild(coin);
                coinPool.push(coin);
            }
        }

        // 读取本地存储数据
        function loadLocalData() {
            const data = JSON.parse(localStorage.getItem('salaryCalcData') || '{}');
            if (data.monthSalary) monthSalaryEl.value = data.monthSalary;
            if (data.workDays) workDaysEl.value = data.workDays;
            if (data.startTime) startTimeEl.value = data.startTime;
            if (data.endTime) endTimeEl.value = data.endTime;
        }

        // 保存数据到本地
        function saveLocalData() {
            const data = {
                monthSalary: monthSalaryEl.value,
                workDays: workDaysEl.value,
                startTime: startTimeEl.value,
                endTime: endTimeEl.value
            };
            localStorage.setItem('salaryCalcData', JSON.stringify(data));
        }

        // 获取今日日期字符串
        function getTodayDate() {
            const now = new Date();
            return `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')}`;
        }

        // 时间转分钟数
        function timeToMin(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        // 判断是否在工作时间内
        function isInWorkTime() {
            const now = new Date();
            const nowMin = now.getHours() * 60 + now.getMinutes();
            const startMin = timeToMin(startTimeEl.value);
            const endMin = timeToMin(endTimeEl.value);
            return nowMin >= startMin && nowMin < endMin;
        }

        // ====================== 金币雨特效 ======================
        function createCoinRain() {
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const coin = coinPool[poolIndex];
                    poolIndex = (poolIndex + 1) % COIN_POOL_SIZE;

                    coin.style.display = 'block';
                    coin.style.opacity = '1';
                    const startX = Math.random() * window.innerWidth;
                    coin.style.left = startX + 'px';

                    const fallDuration = 3000 + Math.random() * 2000;
                    const fallDistance = window.innerHeight + 50;
                    const rotateX = 360 + Math.random() * 720;
                    const rotateY = 360 + Math.random() * 720;

                    const animation = coin.animate([
                        { transform: `translateY(-50px) rotateX(0deg) rotateY(0deg)`, opacity: 1 },
                        { transform: `translateY(${fallDistance}px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`, opacity: 0 }
                    ], {
                        duration: fallDuration,
                        easing: 'ease-in',
                        fill: 'forwards'
                    });

                    animation.onfinish = () => {
                        coin.style.display = 'none';
                        coin.style.transform = 'none';
                    };
                }, i * 60);
            }
        }

        // 播放金币音效
        function playCoinSound() {
            coinSound.currentTime = 0;
            coinSound.play().catch(err => console.log('音效播放需用户交互触发'));
        }

        // ====================== 历史记录功能 ======================
        function saveTodayHistory() {
            if (todayMoney <= 0) return;
            const history = JSON.parse(localStorage.getItem('salaryHistory') || '{}');
            history[todayDate] = todayMoney.toFixed(2);
            localStorage.setItem('salaryHistory', JSON.stringify(history));
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('salaryHistory') || '{}');
            const keys = Object.keys(history).sort().reverse();
            historyList.innerHTML = '';

            if (keys.length === 0) {
                historyList.innerHTML = '<div class="history-empty">暂无历史记录</div>';
                return;
            }

            keys.forEach(date => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <span class="history-date">${date}</span>
                    <span class="history-money">${history[date]} 元</span>
                `;
                historyList.appendChild(item);
            });
        }

        // 跨天检测
        function checkDateChange() {
            const nowDate = getTodayDate();
            if (nowDate !== todayDate) {
                saveTodayHistory();
                todayDate = nowDate;
                todayMoney = 0;
                todayMoneyEl.innerText = '0.00 元';
                miniTodayMoneyEl.innerText = '0.00元';
            }
        }

        // ====================== 新增：迷你窗口拖拽功能 ======================
        // 鼠标按下开始拖拽
        miniWindow.addEventListener('mousedown', (e) => {
            isDragging = true;
            // 计算鼠标和窗口左上角的偏移量
            dragOffsetX = e.clientX - miniWindow.offsetLeft;
            dragOffsetY = e.clientY - miniWindow.offsetTop;
            miniWindow.style.opacity = '0.8';
        });

        // 鼠标移动拖拽
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            // 计算新位置
            let newX = e.clientX - dragOffsetX;
            let newY = e.clientY - dragOffsetY;
            // 边界检测，不拖出屏幕
            const winWidth = window.innerWidth;
            const winHeight = window.innerHeight;
            const miniWidth = miniWindow.offsetWidth;
            const miniHeight = miniWindow.offsetHeight;
            newX = Math.max(0, Math.min(newX, winWidth - miniWidth));
            newY = Math.max(0, Math.min(newY, winHeight - miniHeight));
            // 设置新位置
            miniWindow.style.left = newX + 'px';
            miniWindow.style.top = newY + 'px';
            miniWindow.style.right = 'auto';
        });

        // 鼠标松开结束拖拽
        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                miniWindow.style.opacity = '1';
            }
        });

        // 窗口大小变化时重新做边界检测
        window.addEventListener('resize', () => {
            const winWidth = window.innerWidth;
            const winHeight = window.innerHeight;
            const miniWidth = miniWindow.offsetWidth;
            const miniHeight = miniWindow.offsetHeight;
            let nowX = miniWindow.offsetLeft;
            let nowY = miniWindow.offsetTop;
            nowX = Math.max(0, Math.min(nowX, winWidth - miniWidth));
            nowY = Math.max(0, Math.min(nowY, winHeight - miniHeight));
            miniWindow.style.left = nowX + 'px';
            miniWindow.style.top = nowY + 'px';
            miniWindow.style.right = 'auto';
        });

        // ====================== 新增：迷你模式切换 ======================
        // 切换到迷你模式
        miniBtn.addEventListener('click', () => {
            mainContainer.classList.add('container-hidden');
            miniWindow.classList.add('mini-window-show');
        });

        // 切换回全屏模式
        maxBtn.addEventListener('click', () => {
            mainContainer.classList.remove('container-hidden');
            miniWindow.classList.remove('mini-window-show');
        });

        // 迷你窗暂停/继续按钮联动
        miniPauseBtn.addEventListener('click', () => {
            pauseBtn.click();
        });

        // ====================== 核心计时逻辑 ======================
        // 开始计时
        startBtn.addEventListener('click', () => {
            const monthSalary = parseFloat(monthSalaryEl.value);
            const workDays = parseInt(workDaysEl.value);
            const startTime = startTimeEl.value;
            const endTime = endTimeEl.value;

            if (!monthSalary || !workDays || !startTime || !endTime) {
                alert('请完整填写所有输入项！');
                return;
            }
            if (monthSalary <= 0 || workDays <= 0 || workDays > 31) {
                alert('请输入有效的月薪和上班天数！');
                return;
            }

            const startMin = timeToMin(startTime);
            const endMin = timeToMin(endTime);
            const workMinTotal = endMin - startMin;
            if (workMinTotal <= 0) {
                alert('下班时间必须晚于上班时间！');
                return;
            }

            saveLocalData();

            // 计算每秒收入
            const dayMoney = monthSalary / workDays;
            perSecondMoney = dayMoney / (workMinTotal * 60);

            // 重置状态
            totalMoney = 0;
            todayMoney = 0;
            lastTenNum = 0;
            isPaused = false;
            clearInterval(timer);

            // 更新界面
            perSecondMoneyEl.innerText = perSecondMoney.toFixed(4) + ' 元';
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            miniBtn.disabled = false;
            // 更新状态提示
            statusTipEl.className = 'status-tip status-working';
            statusTipEl.innerText = '正在赚钱中...';
            miniStatusEl.className = 'mini-status status-working';
            miniStatusEl.innerText = '正在赚钱中';
            miniPauseBtn.innerText = '⏸';

            // 启动秒级计时器
            timer = setInterval(() => {
                checkDateChange();

                // 暂停/非工作时间不累计
                if (isPaused || !isInWorkTime()) {
                    const tipText = isPaused ? '已暂停' : '非工作时间';
                    statusTipEl.className = 'status-tip status-pause';
                    statusTipEl.innerText = tipText;
                    miniStatusEl.className = 'mini-status status-pause';
                    miniStatusEl.innerText = tipText;
                    return;
                }

                // 累计金额
                totalMoney += perSecondMoney;
                todayMoney += perSecondMoney;

                // 更新主界面
                const showTotal = totalMoney.toFixed(2);
                const showToday = todayMoney.toFixed(2);
                realMoneyEl.innerText = showTotal + ' 元';
                todayMoneyEl.innerText = showToday + ' 元';
                // 更新迷你窗
                miniTotalMoneyEl.innerText = showTotal + '元';
                miniTodayMoneyEl.innerText = showToday + '元';

                // 数字跳动动画
                realMoneyEl.classList.remove('num-animate');
                void realMoneyEl.offsetWidth;
                realMoneyEl.classList.add('num-animate');

                // 更新状态
                statusTipEl.className = 'status-tip status-working';
                statusTipEl.innerText = '正在赚钱中...';
                miniStatusEl.className = 'mini-status status-working';
                miniStatusEl.innerText = '正在赚钱中';

                // 10的倍数触发金币雨+音效
                const intMoney = Math.floor(totalMoney);
                if (intMoney % 10 === 0 && intMoney > lastTenNum) {
                    lastTenNum = intMoney;
                    createCoinRain();
                    playCoinSound();
                }
            }, 1000);
        });

        // 暂停/继续
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            const btnText = isPaused ? '继续计时' : '暂停计时';
            const miniBtnText = isPaused ? '▶' : '⏸';
            pauseBtn.innerText = btnText;
            miniPauseBtn.innerText = miniBtnText;

            if (!isPaused) {
                statusTipEl.className = 'status-tip status-working';
                statusTipEl.innerText = '正在赚钱中...';
                miniStatusEl.className = 'mini-status status-working';
                miniStatusEl.innerText = '正在赚钱中';
            } else {
                statusTipEl.className = 'status-tip status-pause';
                statusTipEl.innerText = '已暂停';
                miniStatusEl.className = 'mini-status status-pause';
                miniStatusEl.innerText = '已暂停';
            }
        });

        // 重置
        resetBtn.addEventListener('click', () => {
            saveTodayHistory();
            clearInterval(timer);
            // 重置状态
            totalMoney = 0;
            todayMoney = 0;
            lastTenNum = 0;
            isPaused = false;
            // 重置主界面
            realMoneyEl.innerText = '0.00 元';
            todayMoneyEl.innerText = '0.00 元';
            perSecondMoneyEl.innerText = '0.0000 元';
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            miniBtn.disabled = true;
            pauseBtn.innerText = '暂停/继续';
            statusTipEl.className = 'status-tip status-pause';
            statusTipEl.innerText = '未开始计时';
            // 重置迷你窗
            miniTotalMoneyEl.innerText = '0.00元';
            miniTodayMoneyEl.innerText = '0.00元';
            miniStatusEl.className = 'mini-status status-pause';
            miniStatusEl.innerText = '未开始';
            miniPauseBtn.innerText = '⏸';
            // 切回主界面
            mainContainer.classList.remove('container-hidden');
            miniWindow.classList.remove('mini-window-show');
        });

        // 历史记录弹窗
        historyBtn.addEventListener('click', () => {
            loadHistory();
            historyModal.style.display = 'flex';
        });

        closeHistoryBtn.addEventListener('click', () => {
            historyModal.style.display = 'none';
        });

        historyModal.addEventListener('click', (e) => {
            if (e.target === historyModal) {
                historyModal.style.display = 'none';
            }
        });

        // 页面卸载时保存历史
        window.addEventListener('beforeunload', () => {
            saveTodayHistory();
        });

        // 页面加载初始化
        window.addEventListener('DOMContentLoaded', () => {
            initCoinPool();
            loadLocalData();
        });
    </script>
</body>
</html>
